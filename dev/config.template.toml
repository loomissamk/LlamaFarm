# God still blocks raw device/kernel paths by default so a pasted preset does
# not immediately hand the model firmware or live-device write access. To go
# lower-level, widen `allowed_roots` and remove specific entries here on purpose.
forbidden_paths = [
  "/boot",
  "/dev",
  "/efi",
  "/lib",
  "/lib64",
  "/lib/modules",
  "/proc",
  "/root",
  "/run",
  "/sbin",
  "/snap",
  "/sys",
  "/usr/lib/firmware",
  "/usr/lib/modules",
  "~/.aws",
  "~/.config",
  "~/.gnupg",
  "~/.ssh",
]
max_actions_per_hour = 200000
max_cost_per_day_cents = 2000000
require_approval_for_medium_risk = false
block_high_risk_commands = false
# God mode allows shell redirects after path validation so local Ollama models
# can create files with `echo > file`, `cat > file << 'EOF'`, and similar flows.
shell_redirect_policy = "allow"
shell_env_passthrough = [
  "CUDA_VISIBLE_DEVICES",
  "DOCKER_HOST",
  "NVIDIA_VISIBLE_DEVICES",
  "OLLAMA_HOST",
]
auto_approve = [
  "agents_inbox",
  "agents_list",
  "agents_send",
  "apply_patch",
  "browser",
  "browser_open",
  "content_search",
  "cron_add",
  "cron_list",
  "cron_remove",
  "cron_run",
  "cron_runs",
  "cron_update",
  "delegate",
  "delegate_coordination_status",
  "file_edit",
  "file_read",
  "file_write",
  "git_operations",
  "glob_search",
  "http_request",
  "memory_forget",
  "memory_recall",
  "memory_store",
  "model_routing_config",
  "pdf_read",
  "process",
  "schedule",
  "shell",
  "task_plan",
  "web_fetch",
  "web_search_tool",
]
always_ask = []
# execution_mode options: chat | operator | autonomous_operator | chaos_lab
execution_mode = "autonomous_operator"
# Uncomment for full chaos mode (intentional break/recover on disposable targets):
# execution_mode = "chaos_lab"
# chaos_disk_quota_mb = 4096
chaos_retry_budget = 50
wall_clock_cap_secs = 0
allowed_roots = [
  "/",
  "~",
  "/llamafarm-data",
]
non_cli_excluded_tools = [
  "composio",
  "image_info",
  "proxy_config",
  "pushover",
  "screenshot",
]
non_cli_natural_language_approval_mode = "direct"

[browser]
enabled = true
allowed_domains = ["*"]
browser_open = "disable"
session_name = "llamafarm-local"
backend = "auto"
native_headless = true
native_webdriver_url = "http://chromium:4444"

[http_request]
enabled = true
allowed_domains = ["*"]
max_response_size = 5000000
timeout_secs = 60

[web_fetch]
enabled = true
provider = "fast_html2md"
allowed_domains = ["*"]
blocked_domains = []
max_response_size = 1000000
timeout_secs = 60

[web_search]
enabled = true
provider = "duckduckgo"
max_results = 8
timeout_secs = 20

[research]
enabled = true
trigger = "keywords"
keywords = ["check", "compare", "find", "how", "inspect", "investigate", "search", "show", "where", "why"]
max_iterations = 16
show_progress = true

[skills]
prompt_injection_mode = "compact"

[workspaces]
enabled = true
root = "workspaces"

[federation]
# The bundled local personas are usable immediately. Persisted operator choices
# remain authoritative during upgrades; the startup migration never flips this.
enable_delegation = true

[agents_ipc]
enabled = true
db_path = "~/.llamafarm/agents.db"
staleness_secs = 600

# Auto-detect picks Docker whenever the socket is reachable (it is here, for
# the docker/service_control/package_manager tools) and wraps every shell
# call in its own fresh `docker run --rm` — no volume mount, no network, a
# bare Alpine image with no python3 or anything else the outer container
# already has installed. Every effect vanishes the instant that throwaway
# container exits, so multi-step shell work (write a file, then read it back)
# silently fails file-not-found on the very next call. This container is
# already the disposable, isolated environment (that's the whole point of
# the bundle image) — nesting another sandbox inside it is redundant at best
# and breaks ordinary shell use at worst.
[security.sandbox]
backend = "none"

[security.resources]
max_memory_mb = 16384
max_cpu_time_seconds = 7200
max_subprocesses = 256
memory_monitoring = true

[security.audit]
enabled = true
log_path = "audit.log"
max_size_mb = 250
sign_events = true

[security.estop]
enabled = true
state_file = "estop-state.json"
require_otp_to_resume = false

[hooks]
enabled = true

[hooks.builtin]
command_logger = true

[observability]
backend = "log"
runtime_trace_mode = "rolling"
runtime_trace_path = "state/runtime-trace.jsonl"
runtime_trace_max_entries = 2000

[goal_loop]
enabled = true
interval_minutes = 5
step_timeout_secs = 600
max_steps_per_cycle = 16

# SOP engine: all SOPs default to fully autonomous execution (no approval gates).
[sop]
default_execution_mode = "auto"
max_concurrent_total = 32
approval_timeout_secs = 0
max_finished_runs = 500

[[model_routes]]
hint = "planner"
provider = "ollama"
model = "qwen3.5:9b"

[[model_routes]]
hint = "coder"
provider = "ollama"
model = "qwen3.5:9b"

[[model_routes]]
hint = "verifier"
provider = "ollama"
model = "qwen3.5:9b"

[[model_routes]]
hint = "operator"
provider = "ollama"
model = "qwen3.5:9b"

[[model_routes]]
hint = "devsecops"
provider = "ollama"
model = "qwen3.5:9b"

[agents.planner]
# Empty provider/model follows whatever default_provider/default_model
# above is set to, so this persona doesn't go stale the next time the
# operator switches models. Set explicitly here only to pin this specific
# persona to a different model than the system default.
provider = ""
model = ""
temperature = 0.1
max_depth = 2
agentic = true
system_prompt = """
You are the PLANNER. Your only job is to turn a task into a concrete,
checkable plan — you do not implement anything yourself.

For each step, write down: what will change, which file(s) or system it
touches, and what EVIDENCE would prove it actually worked (a command to
run, an output to check, a file to inspect) — not just "it should work."
If a step can't be verified by checking something real, rewrite it until
it can.

Never mark anything as done. You only plan; the coder implements, the
verifier checks. Do not write code, do not run mutating commands, do not
claim a step is complete. If the task is small enough that a plan is
overkill, say so plainly instead of manufacturing steps to fill space.
"""
allowed_tools = [
  "content_search",
  "delegate_coordination_status",
  "file_read",
  "glob_search",
  "http_request",
  "memory_recall",
  "schedule",
  "shell",
  "web_fetch",
  "web_search_tool",
]
max_iterations = 24

[agents.coder]
# Empty provider/model follows whatever default_provider/default_model
# above is set to, so this persona doesn't go stale the next time the
# operator switches models. Set explicitly here only to pin this specific
# persona to a different model than the system default.
provider = ""
model = ""
temperature = 0.1
max_depth = 2
agentic = true
system_prompt = """
You are the CODER. Implement exactly what was asked — nothing more,
nothing dressed up to sound more impressive than it is.

Before reporting anything as done: run it. A test passing, a script
producing real output, a page loading — actual evidence, not your own
description of what the code should do. If you did not run it, say so
explicitly instead of implying you did.

Never state that a feature, integration, or fix exists unless you can
point to the specific code you wrote that implements it. Do not mention
capabilities (an API integration, a data source, a library) that aren't
backed by real code in this change — a claim with no corresponding code is
worse than no claim at all.

Edit the existing file in place. Do not create v2/fixed/enhanced/final/
improved variants of a file that already exists — that leaves dead
duplicates behind and nobody knows which one is real. If your first
attempt at something didn't work, fix it in the same file.

If something fails, report the exact failure. Do not paper over it by
writing a replacement that avoids testing the failure case.
"""
allowed_tools = [
  "apply_patch",
  "content_search",
  "file_edit",
  "file_read",
  "file_write",
  "git_operations",
  "glob_search",
  "memory_recall",
  "process",
  "shell",
]
max_iterations = 48

[agents.verifier]
# Empty provider/model follows whatever default_provider/default_model
# above is set to, so this persona doesn't go stale the next time the
# operator switches models. Set explicitly here only to pin this specific
# persona to a different model than the system default.
provider = ""
model = ""
temperature = 0.0
max_depth = 2
agentic = true
system_prompt = """
You are the VERIFIER. Your default posture is distrust: assume any claim
you're checking might be wrong or exaggerated until you've personally
confirmed it against real evidence.

For every claim you're asked to check, do the check yourself rather than
reading a description of the check: run the command, read the actual file
content, grep for the thing that's claimed to exist. A commit message,
summary, or prior agent's own report is not evidence — it's a claim to be
verified, same as anything else.

Concretely: if something claims a feature/integration exists, grep the
codebase for it — if you find no matching code, that claim is FALSE, say
so plainly. If something claims a command succeeded, re-run it or inspect
its actual output/exit code — don't accept "it worked" at face value. If
something claims a bug is fixed, exercise the exact failing case that was
reported and confirm it no longer fails.

Give a clear verdict: PASS or FAIL, with the specific evidence for each.
If you're not sure, say "not verified" — do not round an unverified claim
up to a pass. You have no write access on purpose; you inspect, you do
not fix. Report problems back for the coder to address.
"""
allowed_tools = [
  "content_search",
  "file_read",
  "git_operations",
  "glob_search",
  "http_request",
  "memory_recall",
  "process",
  "shell",
  "web_fetch",
]
max_iterations = 24

[agents.operator]
# Empty provider/model follows whatever default_provider/default_model
# above is set to, so this persona doesn't go stale the next time the
# operator switches models. Set explicitly here only to pin this specific
# persona to a different model than the system default.
provider = ""
model = ""
temperature = 0.1
max_depth = 2
agentic = true
system_prompt = """
You are the OPERATOR. You manage scheduling and cross-agent coordination —
cron jobs, delegating to other agents, checking on running work. You do
not write or edit code.

When creating or modifying a cron job, keep its scope narrow and
deterministic wherever possible: a job that runs one specific command and
reports the real output is far safer than one given open-ended latitude
to "improve things" on its own schedule. If a job's task genuinely
requires judgment (not just execution), say so explicitly and keep its
tool access as narrow as the task allows — do not hand out file-write or
git access to a job unless the task specifically requires editing files.

Before considering a scheduling change "done," verify it actually behaves
as intended — trigger it once and check the real result, don't assume the
configuration is correct because it looks right.
"""
allowed_tools = [
  "agents_inbox",
  "agents_list",
  "agents_send",
  "content_search",
  "cron_add",
  "cron_list",
  "cron_remove",
  "cron_run",
  "cron_runs",
  "cron_update",
  "delegate_coordination_status",
  "file_read",
  "glob_search",
  "http_request",
  "memory_recall",
  "process",
  "schedule",
  "shell",
  "web_fetch",
]
max_iterations = 32

[agents.devsecops]
# Follow the dashboard-selected default model unless the operator deliberately
# pins this agent to a separate provider/model.
provider = ""
model = ""
temperature = 0.0
max_depth = 2
agentic = true
system_prompt = """
You are the DEVSECOPS agent. Own deployment, runtime, container, service,
scheduler, upgrade, health, and security operations for the requested scope.

Work evidence-first. Inspect the real current state before changing it, make the
smallest scoped change, and verify it independently with exit status, health
endpoints, logs, process/container state, or scheduler run history. Never treat
a plan, generated file, or command text as proof that an action ran.

Keep changes reversible. Capture the current configuration and rollback target
before replacement, preserve named volumes and user data, prefer health-gated
rollouts, and report the exact rollback path. Do not prune, delete, or recreate
unrelated containers, volumes, services, repositories, or scheduled jobs.

When host_exec is listed, use it for host commands and long-running host jobs.
The docker tool controls the host Docker daemon when the host socket is mounted;
use it to inspect and update the real host containers rather than attempting
Docker-in-Docker. If host_exec is not listed, use the available Docker/socket
tools and state the exact remaining host boundary instead of simulating success.

Database access is diagnostic by default: use db_schema and configured
read-only paths. Before any database mutation, migration, authentication change,
restore, or index change, create a fresh scoped backup, record its path and
checksum, and prove that the backup is readable (restore dry-run or equivalent).
If that evidence is missing, do not perform the mutation. Never expose
connection strings, passwords, tokens, or secret-bearing command output.

For cron changes, prefer deterministic shell jobs over open-ended agent jobs.
After adding or changing a job, run it once and inspect its recorded result.
"""
allowed_tools = [
  "apply_patch",
  "content_search",
  "cron_add",
  "cron_list",
  "cron_remove",
  "cron_run",
  "cron_runs",
  "cron_update",
  "db_schema",
  "docker",
  "file_edit",
  "file_read",
  "file_write",
  "git_operations",
  "glob_search",
  "host_exec",
  "http_request",
  "memory_recall",
  "package_manager",
  "packet_capture",
  "process",
  "service_control",
  "shell",
]
max_iterations = 48


# ── arXiv RAG ──────────────────────────────────────────────────────────────────
# Semantic search over the local arXiv corpus stored in Qdrant.
# Set enabled = true after running scripts/arxiv_to_qdrant.py to populate the index.
[arxiv_rag]
enabled = false
qdrant_url = "http://qdrant:6333"
embed_url = "http://127.0.0.1:11434"
embed_model = "nomic-embed-text"
collection = "arxiv_papers"


# ── Database Explorer ──────────────────────────────────────────────────────────
# Add one [[db_connections]] block per database.
# Supported drivers: sqlite, postgres, mongodb  (mysql coming soon)
# These connections appear in the Database tab and are available to the LLM via
# the db_schema and db_query tools.
#
# [[db_connections]]
# name     = "arxiv"
# driver   = "mongodb"
# uri      = "mongodb://192.168.1.176:27017"
# database = "ArXivDB"
# read_only = true
# max_rows  = 200
#
# [[db_connections]]
# name     = "local"
# driver   = "sqlite"
# uri      = "/llamafarm-data/local.db"
# read_only = false
