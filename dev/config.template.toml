# God local engineering/operator profile.
#
# Intended use:
# - full Ollama-first autonomy with broad userland, build, and Docker authority
# - very large action/tool budgets for long local runs
# - audit logging and emergency stop preserved
# - enough room to widen into lower-level host access by editing the command and
#   path allowlists below
#
# If you run Ollama directly on the host instead of the dev container,
# change the Ollama URL below to `http://127.0.0.1:11434`.
api_url = "http://host.docker.internal:11434"
default_provider = "ollama"
default_model = "qwen3-coder:30b"
default_temperature = 0.2
model_support_vision = true

[gateway]
port = 42617
host = "127.0.0.1"
require_pairing = false
allow_public_bind = false
request_timeout_secs = 300

[agent]
compact_context = false
tool_routing_enabled = true
tool_routing_top_k = 12
max_tool_iterations = 100000
max_history_messages = 160
parallel_tools = false
# Local Ollama models on this machine are still more reliable with the XML
# dispatcher than native function-calling in this stack.
tool_dispatcher = "xml"

[host_runner]
# The Docker bundle enables this only through an explicit environment opt-in
# after scripts/install-host-runner.sh has installed the user service.
enabled = false
max_exec_timeout_secs = 300

