# For the high-power local engineering/operator profile, copy `dev/config.power.toml`
# or start the dev stack with `ZEROCLAW_DEV_PROFILE=power ./dev/cli.sh up`.
# Ollama base URL
api_url = "http://host.docker.internal:11434"
default_provider = "ollama"
default_model = "devstral-small-2:latest"
default_temperature = 0.7

[gateway]
port = 42617
host = "0.0.0.0"
require_pairing = false
allow_public_bind = true
request_timeout_secs = 30
