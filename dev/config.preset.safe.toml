# Safe local operator preset.
#
# Intended use:
# - safer local autonomy with workspace-only boundaries
# - explicit approval for medium-risk actions
# - enough shell/build access for normal coding work without broad host mutation
#
# This preset is exposed in the dashboard config editor. The local Docker stack
# still boots from `dev/config.template.toml` by default.
api_url = "http://host.docker.internal:11434"
default_provider = "ollama"
default_model = "qwen3.5:9b"
default_temperature = 0.2
model_support_vision = true

[gateway]
port = 42617
host = "127.0.0.1"
require_pairing = false
allow_public_bind = false
request_timeout_secs = 180

[agent]
compact_context = false
max_tool_iterations = 96
max_history_messages = 80
parallel_tools = false
tool_dispatcher = "xml"

[autonomy]
level = "full"
workspace_only = true
allowed_commands = [
  "awk",
  "bash",
  "cargo",
  "cat",
  "cmake",
  "cut",
  "curl",
  "date",
  "df",
  "diff",
  "du",
  "echo",
  "env",
  "file",
  "find",
  "git",
  "go",
  "grep",
  "head",
  "jq",
  "ls",
  "lsblk",
  "lspci",
  "lsusb",
  "make",
  "node",
  "npm",
  "pwd",
  "pytest",
  "python",
  "python3",
  "readlink",
  "realpath",
  "rg",
  "rsync",
  "rustc",
  "sed",
  "sh",
  "sort",
  "sqlite3",
  "stat",
  "tail",
  "uname",
  "wc",
  "whoami",
]
forbidden_paths = [
  "/boot",
  "/dev",
  "/efi",
  "/etc",
  "/home",
  "/lib",
  "/lib64",
  "/lib/modules",
  "/media",
  "/mnt",
  "/opt",
  "/proc",
  "/root",
  "/run",
  "/sbin",
  "/snap",
  "/srv",
  "/sys",
  "/tmp",
  "/usr",
  "/usr/lib/firmware",
  "/usr/lib/modules",
  "/var",
  "~/.aws",
  "~/.config",
  "~/.gnupg",
  "~/.ssh",
]
max_actions_per_hour = 5000
max_cost_per_day_cents = 50000
require_approval_for_medium_risk = false
block_high_risk_commands = true
shell_redirect_policy = "strip"
shell_env_passthrough = [
  "CUDA_VISIBLE_DEVICES",
  "DOCKER_HOST",
  "NVIDIA_VISIBLE_DEVICES",
  "OLLAMA_HOST",
]
auto_approve = [
  "apply_patch",
  "content_search",
  "file_edit",
  "file_read",
  "file_write",
  "git_operations",
  "glob_search",
  "memory_recall",
  "process",
  "shell",
  "web_fetch",
  "web_search_tool",
]
always_ask = [
  "cron_add",
  "cron_remove",
  "cron_update",
  "schedule",
]
allowed_roots = [
  "~",
  "/llamafarm-data",
]
non_cli_excluded_tools = [
  "composio",
  "image_info",
  "proxy_config",
  "pushover",
  "screenshot",
]
non_cli_natural_language_approval_mode = "direct"

[browser]
enabled = true
allowed_domains = ["*"]
browser_open = "disable"
session_name = "llamafarm-local"
backend = "auto"
native_headless = true
native_webdriver_url = "http://chromium:4444"

[http_request]
enabled = true
allowed_domains = ["*"]
max_response_size = 2000000
timeout_secs = 30

[web_fetch]
enabled = true
provider = "fast_html2md"
allowed_domains = ["*"]
blocked_domains = []
max_response_size = 500000
timeout_secs = 30

[web_search]
enabled = true
provider = "duckduckgo"
max_results = 5
timeout_secs = 15

[research]
enabled = true
trigger = "keywords"
keywords = ["check", "compare", "find", "how", "inspect", "investigate", "search", "show", "where", "why"]
max_iterations = 6
show_progress = true

[skills]
prompt_injection_mode = "compact"

[workspaces]
enabled = true
root = "workspaces"

[agents_ipc]
enabled = true
db_path = "~/.llamafarm/agents.db"
staleness_secs = 600

[security.resources]
max_memory_mb = 4096
max_cpu_time_seconds = 1800
max_subprocesses = 64
memory_monitoring = true

[security.audit]
enabled = true
log_path = "audit.log"
max_size_mb = 250
sign_events = true

[security.estop]
enabled = true
state_file = "estop-state.json"
require_otp_to_resume = false

[hooks]
enabled = true

[hooks.builtin]
command_logger = true

[observability]
backend = "log"
runtime_trace_mode = "rolling"
runtime_trace_path = "state/runtime-trace.jsonl"
runtime_trace_max_entries = 2000

[goal_loop]
enabled = false
interval_minutes = 10
step_timeout_secs = 300
max_steps_per_cycle = 4

[[model_routes]]
hint = "planner"
provider = "ollama"
model = "qwen2.5-coder:14b"

[[model_routes]]
hint = "coder"
provider = "ollama"
model = "qwen2.5-coder:14b"

[[model_routes]]
hint = "verifier"
provider = "ollama"
model = "qwen2.5-coder:14b"

[[model_routes]]
hint = "operator"
provider = "ollama"
model = "qwen3.5:9b"

[agents.planner]
provider = "ollama"
model = "qwen2.5-coder:14b"
temperature = 0.1
max_depth = 2
agentic = true
allowed_tools = [
  "content_search",
  "delegate_coordination_status",
  "file_read",
  "glob_search",
  "http_request",
  "memory_recall",
  "schedule",
  "shell",
  "web_fetch",
  "web_search_tool",
]
max_iterations = 12

[agents.coder]
provider = "ollama"
model = "qwen2.5-coder:14b"
temperature = 0.1
max_depth = 2
agentic = true
allowed_tools = [
  "apply_patch",
  "content_search",
  "file_edit",
  "file_read",
  "file_write",
  "git_operations",
  "glob_search",
  "memory_recall",
  "process",
  "shell",
]
max_iterations = 14

[agents.verifier]
provider = "ollama"
model = "qwen2.5-coder:14b"
temperature = 0.0
max_depth = 2
agentic = true
allowed_tools = [
  "content_search",
  "file_read",
  "git_operations",
  "glob_search",
  "http_request",
  "memory_recall",
  "process",
  "shell",
  "web_fetch",
]
max_iterations = 12

[agents.operator]
provider = "ollama"
model = "qwen3.5:9b"
temperature = 0.1
max_depth = 2
agentic = true
allowed_tools = [
  "agents_inbox",
  "agents_list",
  "agents_send",
  "content_search",
  "cron_add",
  "cron_list",
  "cron_remove",
  "cron_run",
  "cron_runs",
  "cron_update",
  "delegate_coordination_status",
  "file_read",
  "glob_search",
  "http_request",
  "memory_recall",
  "process",
  "schedule",
  "shell",
  "web_fetch",
]
max_iterations = 16
