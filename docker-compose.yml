# LlamaFarm local Docker Compose
#
# Quick start:
#   1. Make sure Ollama is running on the host at http://127.0.0.1:11434
#   2. Run: docker compose up -d --build
#   3. Open http://127.0.0.1:42617

name: llamafarm-local

services:
  llamafarm:
    image: llamafarm-local:dev
    build:
      context: .
      target: dev
    container_name: LlamaFarm
    restart: unless-stopped

    environment:
      - ZEROCLAW_ALLOW_PUBLIC_BIND=true
      - ZEROCLAW_GATEWAY_HOST=0.0.0.0
      - ZEROCLAW_REQUIRE_PAIRING=false
      - SHELL=/bin/bash
      # Default gateway port inside container
      - ZEROCLAW_GATEWAY_PORT=${ZEROCLAW_GATEWAY_PORT:-42617}

    volumes:
      # Keep the local operator state on a stable volume so redeploys from
      # different worktrees do not silently fork the live data set.
      - llamafarm-data:/zeroclaw-data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "127.0.0.1:${HOST_PORT:-42617}:${ZEROCLAW_GATEWAY_PORT:-42617}"

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${ZEROCLAW_GATEWAY_PORT:-42617}/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  llamafarm-data:
    name: llamafarm-data
