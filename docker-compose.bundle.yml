# LlamaFarm bundled local Docker Compose
#
# This stack is fully self-contained:
# - LlamaFarm gateway
# - local Ollama runtime inside the same container
# - local Chromium + chromedriver inside the same container
#
# Quick start (auto GPU detection):
#   ./scripts/docker/up-bundle.sh
#
# NVIDIA gaming desktop (explicit GPU passthrough):
#   ./scripts/docker/up-bundle-nvidia.sh
#   -- or --
#   docker compose -f docker-compose.bundle.yml -f docker-compose.bundle.nvidia.yml up -d --build
#
# CPU-only / generic fallback:
#   docker compose -f docker-compose.bundle.yml up -d --build
#   open http://127.0.0.1:42617
#   open http://127.0.0.1:3000
#   or set LLAMAFARM_HOST_BIND_IP=0.0.0.0 for LAN access

name: llamafarm-bundle

services:
  llamafarm:
    image: llamafarm-local:bundle
    build:
      context: .
      target: bundle
      args:
        LLAMAFARM_CARGO_FEATURES: browser-native,db-mongo,db-postgres,db-mysql,rag-pdf
        LLAMAFARM_BUILD_COMMIT: ${LLAMAFARM_BUILD_COMMIT:-}
        LLAMAFARM_BUILD_TIME: ${LLAMAFARM_BUILD_TIME:-}
    container_name: LlamaFarm
    restart: unless-stopped
    init: true
    # Share the host IPC namespace instead of imposing a container /dev/shm
    # budget. This local single-tenant bundle may use the host's natural
    # shared-memory capacity.
    ipc: host

    environment:
      # The service listens on all container interfaces so Docker can publish
      # it, while the host-side port mapping below defaults to loopback.
      - LLAMAFARM_ALLOW_PUBLIC_BIND=${LLAMAFARM_ALLOW_PUBLIC_BIND:-true}
      - LLAMAFARM_GATEWAY_HOST=${LLAMAFARM_GATEWAY_HOST:-0.0.0.0}
      # The local bundle is direct-access by design. This fixed value also
      # overrides stale persisted config from an older paired deployment.
      - LLAMAFARM_GATEWAY_PORT=${LLAMAFARM_GATEWAY_PORT:-42617}
      - LLAMAFARM_BUILD_COMMIT=${LLAMAFARM_BUILD_COMMIT:-}
      - LLAMAFARM_BUILD_TIME=${LLAMAFARM_BUILD_TIME:-}
      - RUST_LOG=${RUST_LOG:-info}
      - DISPLAY=${LLAMAFARM_DISPLAY:-:99}
      # Leave empty by default so a model selected and persisted in the
      # dashboard remains authoritative after the container restarts.
      # Set LLAMAFARM_MODEL explicitly only when an immutable deployment-level
      # override is intentional.
      - LLAMAFARM_MODEL=${LLAMAFARM_MODEL:-}
      - LLAMAFARM_AGENT_COMPACT_CONTEXT=${LLAMAFARM_AGENT_COMPACT_CONTEXT:-true}
      - LLAMAFARM_AGENT_TOOL_ROUTING_ENABLED=${LLAMAFARM_AGENT_TOOL_ROUTING_ENABLED:-true}
      - LLAMAFARM_AGENT_TOOL_ROUTING_TOP_K=${LLAMAFARM_AGENT_TOOL_ROUTING_TOP_K:-12}
      - LLAMAFARM_AGENT_MAX_HISTORY_MESSAGES=${LLAMAFARM_AGENT_MAX_HISTORY_MESSAGES:-32}
      - LLAMAFARM_AGENT_MAX_TOOL_ITERATIONS=${LLAMAFARM_AGENT_MAX_TOOL_ITERATIONS:-0}
      - LLAMAFARM_AGENT_PARALLEL_TOOLS=${LLAMAFARM_AGENT_PARALLEL_TOOLS:-false}
      # Forward only an explicit operator value; there is deliberately no
      # bundled generated-token ceiling.
      - LLAMAFARM_AGENT_MAX_OUTPUT_TOKENS
      - LLAMAFARM_WS_PERSISTED_MAX_SESSIONS=${LLAMAFARM_WS_PERSISTED_MAX_SESSIONS:-64}
      - LLAMAFARM_SCHEDULER_MAX_CONCURRENT=${LLAMAFARM_SCHEDULER_MAX_CONCURRENT:-4}
      - LLAMAFARM_SCHEDULER_MAX_TASKS=${LLAMAFARM_SCHEDULER_MAX_TASKS:-64}
      # Free local web search is useful for agents; keep it explicit and
      # overrideable rather than relying on an old persisted config value.
      - LLAMAFARM_WEB_SEARCH_ENABLED=${LLAMAFARM_WEB_SEARCH_ENABLED:-true}
      - LLAMAFARM_WEB_SEARCH_PROVIDER=${LLAMAFARM_WEB_SEARCH_PROVIDER:-duckduckgo}
      - LLAMAFARM_WEB_SEARCH_MAX_RESULTS=${LLAMAFARM_WEB_SEARCH_MAX_RESULTS:-5}
      - LLAMAFARM_WEB_SEARCH_TIMEOUT_SECS=${LLAMAFARM_WEB_SEARCH_TIMEOUT_SECS:-15}
      - LLAMAFARM_FEDERATION_ENABLED=${LLAMAFARM_FEDERATION_ENABLED:-true}
      - LLAMAFARM_NODE_NAME=${LLAMAFARM_NODE_NAME:-llamafarm-node}
      - LLAMAFARM_API_PORT=${LLAMAFARM_API_PORT:-42617}
      - LLAMAFARM_DISCOVERY_MODE=${LLAMAFARM_DISCOVERY_MODE:-mdns}
      - LLAMAFARM_SERVICE_NAME=${LLAMAFARM_SERVICE_NAME:-_llamafarm._tcp}
      - LLAMAFARM_PEER_TIMEOUT_SECONDS=${LLAMAFARM_PEER_TIMEOUT_SECONDS:-30}
      - LLAMAFARM_MANUAL_PEERS=${LLAMAFARM_MANUAL_PEERS:-}
      - LLAMAFARM_FEDERATION_TOKEN=${LLAMAFARM_FEDERATION_TOKEN:-}
      - LLAMAFARM_DEFAULT_ROLE=${LLAMAFARM_DEFAULT_ROLE:-both}
      - LLAMAFARM_ALLOW_REMOTE_SUBAGENTS=${LLAMAFARM_ALLOW_REMOTE_SUBAGENTS:-true}
      - LLAMAFARM_RUNTIME_UID=${LLAMAFARM_RUNTIME_UID:-0}
      - LLAMAFARM_RUNTIME_GID=${LLAMAFARM_RUNTIME_GID:-0}
      # Runtime topology is injected into the agent prompt so it can publish
      # generated apps truthfully and understand that this socket controls the
      # host daemon (this is not an isolated Docker-in-Docker daemon).
      - LLAMAFARM_HOST_DOCKER=${LLAMAFARM_HOST_DOCKER:-true}
      - LLAMAFARM_RESERVED_APP_PORTS=${LLAMAFARM_RESERVED_APP_PORTS:-5000}
      - LLAMAFARM_MANAGED_APP_PORTS=${LLAMAFARM_MANAGED_APP_PORTS:-8501-8599}
      - LLAMAFARM_PUBLIC_APP_HOSTS=${LLAMAFARM_PUBLIC_APP_HOSTS:-}
      - LLAMAFARM_LAN_IP=${LLAMAFARM_LAN_IP:-}
      - LLAMAFARM_TAILSCALE_IP=${LLAMAFARM_TAILSCALE_IP:-}
      - LLAMAFARM_TAILSCALE_SOCKET=${LLAMAFARM_TAILSCALE_SOCKET:-/run/tailscale-host/tailscaled.sock}
      - LLAMAFARM_STOCK_APP_ENABLED=${LLAMAFARM_STOCK_APP_ENABLED:-auto}
      - LLAMAFARM_STOCK_APP_DIR=${LLAMAFARM_STOCK_APP_DIR:-/llamafarm-data/workspace/stock_trading_platform}
      # Host execution is disabled unless the operator installs the user
      # service and explicitly opts this container into its owner-only socket.
      - LLAMAFARM_HOST_RUNNER_ENABLED=${LLAMAFARM_HOST_RUNNER_ENABLED:-false}
      - LLAMAFARM_HOST_RUNNER_SOCKET=${LLAMAFARM_HOST_RUNNER_SOCKET:-}
      - LLAMAFARM_HOST_HOME=${HOME}
      - LLAMAFARM_HOST_RUNNER_MAX_TIMEOUT_SECS=${LLAMAFARM_HOST_RUNNER_MAX_TIMEOUT_SECS:-0}
      - OLLAMA_HOST=0.0.0.0:11434
      # This platform is local-first: never route inference to an Ollama cloud
      # model. Model pulls still use the registry, while generation stays on
      # the GPU attached to this node.
      - OLLAMA_NO_CLOUD=true
      - OLLAMA_PULL_MODELS=${OLLAMA_PULL_MODELS:-}
      # KV cache quantization: halves KV cache VRAM usage, allowing ~2x larger
      # context windows in the same VRAM budget (turboquant-style compression).
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
      # Keep direct Ollama calls and LlamaFarm's explicit per-request num_ctx
      # in agreement. Adaptive mode treats OLLAMA_NUM_CTX as a fast baseline
      # and grows per request; direct Ollama calls retain the baseline.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-32768}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-32768}
      - LLAMAFARM_ADAPTIVE_CONTEXT=${LLAMAFARM_ADAPTIVE_CONTEXT:-false}
      - LLAMAFARM_ADAPTIVE_CONTEXT_MAX=${LLAMAFARM_ADAPTIVE_CONTEXT_MAX:-262144}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      # No idle unload timer: a loaded model stays hot until Ollama needs the
      # memory for another model or the operator explicitly unloads it.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
      # VRAM cap: leave unset to let Ollama auto-detect. Override in .env:
      #   OLLAMA_MAX_VRAM=<bytes>  (e.g. 7516192768 for a 7 GB laptop GPU)
      - OLLAMA_MAX_VRAM=${OLLAMA_MAX_VRAM:-}
      # Reasoning/thinking mode: enabled by default for better tool planning and
      # follow-through. Override with LLAMAFARM_REASONING_ENABLED=false on
      # smaller machines or when a model burns too much context on thinking.
      - LLAMAFARM_REASONING_ENABLED=${LLAMAFARM_REASONING_ENABLED:-true}

    volumes:
      - llamafarm-bundle-data:/llamafarm-data
      # Mirror common host paths so the local-first bundle can work directly
      # against the operator's files and attached storage.
      - ${HOME}:${HOME}
      - /srv:/srv
      - /mnt:/mnt
      - /media:/media
      # Docker socket — lets the docker tool control the host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      # Only the direct-access gateway is intended for optional LAN access. Keep raw
      # inference and vector-store ports on loopback unless an operator has a
      # deliberate, separately secured integration.
      - "${LLAMAFARM_HOST_BIND_IP:-127.0.0.1}:${HOST_PORT:-42617}:${LLAMAFARM_GATEWAY_PORT:-42617}"
      - "${OLLAMA_HOST_BIND_IP:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
      # Port 5000 is reserved for the existing stock-trading gateway. Keep the
      # DEV_APP_PORT name for deployment compatibility, but generated apps
      # must use the separately published managed range below.
      - "${LLAMAFARM_HOST_BIND_IP:-127.0.0.1}:${DEV_APP_PORT:-5000}:5000"
      # One-to-one host/container mappings for generated Streamlit and other
      # development apps. Agents choose the first free port and bind 0.0.0.0.
      - "${LLAMAFARM_HOST_BIND_IP:-127.0.0.1}:${LLAMAFARM_MANAGED_APP_PORTS:-8501-8599}:${LLAMAFARM_MANAGED_APP_PORTS:-8501-8599}"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${LLAMAFARM_GATEWAY_PORT:-42617}/health >/dev/null && curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && curl -fsS http://127.0.0.1:9515/status >/dev/null && DISPLAY=$${DISPLAY:-:99} scrot /tmp/.llamafarm-display-health.png >/dev/null 2>&1 && test -s /tmp/.llamafarm-display-health.png && rm -f /tmp/.llamafarm-display-health.png"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 1800s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: Qdrant
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant-data:/qdrant/storage
    # The REST endpoint is local-only by default. The host ingest script can
    # still reach it at 127.0.0.1 without exposing the vector store to the LAN.
    ports:
      - "${QDRANT_HOST_BIND_IP:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  llamafarm-bundle-data:
    name: llamafarm-bundle-data
  qdrant-data:
    name: qdrant-data
