# LlamaFarm bundled local Docker Compose
#
# This stack is fully self-contained:
# - LlamaFarm gateway
# - local Ollama runtime inside the same container
# - local Chromium + chromedriver inside the same container
#
# Quick start (auto GPU detection):
#   ./scripts/docker/up-bundle.sh
#
# NVIDIA gaming desktop (explicit GPU passthrough):
#   ./scripts/docker/up-bundle-nvidia.sh
#   -- or --
#   docker compose -f docker-compose.bundle.yml -f docker-compose.bundle.nvidia.yml up -d --build
#
# CPU-only / generic fallback:
#   docker compose -f docker-compose.bundle.yml up -d --build
#   open http://127.0.0.1:42617
#   or set HOST_BIND_IP=0.0.0.0 for LAN access

name: llamafarm-bundle

services:
  llamafarm:
    image: llamafarm-local:bundle
    build:
      context: .
      target: bundle
      args:
        LLAMAFARM_CARGO_FEATURES: browser-native
    container_name: LlamaFarm
    restart: unless-stopped
    init: true
    shm_size: 2gb

    environment:
      - LLAMAFARM_ALLOW_PUBLIC_BIND=true
      - LLAMAFARM_GATEWAY_HOST=0.0.0.0
      - LLAMAFARM_REQUIRE_PAIRING=false
      - LLAMAFARM_GATEWAY_PORT=${LLAMAFARM_GATEWAY_PORT:-42617}
      - LLAMAFARM_FEDERATION_ENABLED=${LLAMAFARM_FEDERATION_ENABLED:-true}
      - LLAMAFARM_NODE_NAME=${LLAMAFARM_NODE_NAME:-llamafarm-node}
      - LLAMAFARM_API_PORT=${LLAMAFARM_API_PORT:-42617}
      - LLAMAFARM_DISCOVERY_MODE=${LLAMAFARM_DISCOVERY_MODE:-mdns}
      - LLAMAFARM_SERVICE_NAME=${LLAMAFARM_SERVICE_NAME:-_llamafarm._tcp}
      - LLAMAFARM_PEER_TIMEOUT_SECONDS=${LLAMAFARM_PEER_TIMEOUT_SECONDS:-30}
      - LLAMAFARM_MANUAL_PEERS=${LLAMAFARM_MANUAL_PEERS:-}
      - LLAMAFARM_DEFAULT_ROLE=${LLAMAFARM_DEFAULT_ROLE:-both}
      - LLAMAFARM_ALLOW_REMOTE_SUBAGENTS=${LLAMAFARM_ALLOW_REMOTE_SUBAGENTS:-true}
      - LLAMAFARM_RUNTIME_UID=${LLAMAFARM_RUNTIME_UID:-65534}
      - LLAMAFARM_RUNTIME_GID=${LLAMAFARM_RUNTIME_GID:-65534}
      - OLLAMA_PULL_MODELS=${OLLAMA_PULL_MODELS-devstral-small-2:latest,qwen3-coder:30b,gpt-oss:20b,devstral-2:123b-cloud,gemma4:e2b}

    volumes:
      - llamafarm-bundle-data:/llamafarm-data
      # Mirror common host paths so the local-first bundle can work directly
      # against the operator's files and attached storage.
      - ${HOME}:${HOME}
      - /srv:/srv
      - /mnt:/mnt
      - /media:/media

    ports:
      - "${HOST_BIND_IP:-0.0.0.0}:${HOST_PORT:-42617}:${LLAMAFARM_GATEWAY_PORT:-42617}"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${LLAMAFARM_GATEWAY_PORT:-42617}/health >/dev/null && curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && curl -fsS http://127.0.0.1:9515/status >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 1800s

volumes:
  llamafarm-bundle-data:
    name: llamafarm-bundle-data
